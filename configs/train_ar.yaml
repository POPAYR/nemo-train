  #    不要选 --sources 1,也不要省略 --sources(省略 = 加载全部 → 找不到目录报错)。
  - pose_dir: /media/ps/ssd5/ayr/MEAD_frames_512_25fps/pose_embed
    audio_dir: /media/ps/ssd5/ayr/MEAD_frames_512_25fps/audio_pt
    caption_dir: /media/ps/ssd5/ayr/MEAD_frames_512_25fps/emo_pose_caption
    latent_dir: /media/ps/ssd5/ayr/MEAD_frames_512_25fps/frame_latent
    video_dir: /media/ps/ssd5/ayr/MEAD_frames_512_25fps/face_frames
    data_name_path: /media/ps/ssd5/ayr/MEAD_frames_512_25fps/data.txt
  # ★ MEAD fixed(2026-09-17 清洗定稿):帧按时间轴重采样到真实 25fps,
  #   audio_pt 从视频内嵌音轨抽、长度恒为 帧数*640,caption 已收进本目录 —— 数据集自包含。
  #   ★ audio_dir 千万别指回 MEAD_frames_512_25fps:那一版没做 fps 重采样,
  #     整条时间轴慢放 1.2 倍(=30/25),与本目录的帧对不上。见 DATA.md §16。
  - pose_dir: ${oc.env:XN_MEAD,/media/ps/ssd4/ayr/mead_fixed}/pose_embed
    audio_dir: ${oc.env:XN_MEAD,/media/ps/ssd4/ayr/mead_fixed}/audio_pt
    caption_dir: ${oc.env:XN_MEAD,/media/ps/ssd4/ayr/mead_fixed}/emo_pose_caption
    latent_dir: ${oc.env:XN_MEAD,/media/ps/ssd4/ayr/mead_fixed}/frame_latent
    video_dir: ${oc.env:XN_MEAD,/media/ps/ssd4/ayr/mead_fixed}
    data_name_path: ${oc.env:XN_MEAD,/media/ps/ssd4/ayr/mead_fixed}/train_list.txt
  # ★ source[3]:过拟合诊断专用 —— hallo3 里按"头发/肩线边界带运动量"挑出的 12 条
  #   (边界带帧差中位 0.253 = 全体中位 0.146 的 1.7x,且 band/core 比值高,
  #    即头发相对身体在动,不是整个人平移)。挑法见 tool/pick_high_motion.py。
  - pose_dir: ${oc.env:XN_HALLO3,/media/ps/ssd4/ayr/hallo3_frames_512}/pose_embed
    audio_dir: ${oc.env:XN_HALLO3,/media/ps/ssd4/ayr/hallo3_frames_512}/audio_pt
    caption_dir: ${oc.env:XN_HALLO3,/media/ps/ssd4/ayr/hallo3_frames_512}/emo_pose_caption
    latent_dir: ${oc.env:XN_HALLO3,/media/ps/ssd4/ayr/hallo3_frames_512}/frame_latent
    video_dir: ${oc.env:XN_HALLO3,/media/ps/ssd4/ayr/hallo3_frames_512}/face_frames
    data_name_path: ${oc.env:XN_HALLO3,/media/ps/ssd4/ayr/hallo3_frames_512}/overfit12.txt
